id: 88bd995a-7b94-46a9-8072-67c851b799cf
name: "@aaronge/secret-santa-links"
description: >-
  The free alternative to texting: draw this year's Secret Santa (kept if
  already drawn), compose each person's message and encrypted reveal link,
  verify every link, then write them all to a private file for you to send by
  email, WhatsApp or by hand. No Twilio account needed. Run manually; there's
  no schedule.
version: 1
tags: {}
inputs:
  properties:
    santaModel:
      type: string
      default: santa-family
      description: The @aaronge/secret-santa model to run.
    path:
      type: string
      default: ""
      description: >-
        Where to write the links file. Empty means
        ~/secret-santa-links-<year>.txt. Keep it out of git.
    redraw:
      type: boolean
      default: false
      description: >-
        Throw away this year's existing draw and draw again. Anyone already
        sent a link will have a stale one.
jobs:
  - name: prepare
    description: Draw (or keep the existing draw), compose the messages, and re-check every link.
    dependsOn: []
    steps:
      - name: draw
        task:
          type: model_method
          modelIdOrName: ${{ inputs.santaModel }}
          methodName: draw
          inputs:
            redraw: ${{ inputs.redraw }}
        dependsOn: []
      - name: compose
        task:
          type: model_method
          modelIdOrName: ${{ inputs.santaModel }}
          methodName: compose
        dependsOn:
          - step: draw
            condition:
              type: succeeded
      - name: verify
        task:
          type: model_method
          modelIdOrName: ${{ inputs.santaModel }}
          methodName: verify
        dependsOn:
          - step: compose
            condition:
              type: succeeded

  - name: check
    description: Refuse to export unless every link decrypts and the draw obeys every rule.
    dependsOn:
      - job: prepare
        condition:
          type: succeeded
    steps:
      - name: links-ok
        allowFailure: false
        task:
          type: assert
          expr: data.latest(inputs.santaModel, "linkcheck").attributes.ok == true
          message: >-
            Link check failed: ${{ data.latest(inputs.santaModel, "linkcheck").attributes.problems }}
          severity: high
        dependsOn: []

  - name: export
    description: Write every message to a private file (readable only by you) for sending yourself.
    dependsOn:
      - job: check
        condition:
          type: succeeded
    steps:
      - name: export-links
        task:
          type: model_method
          modelIdOrName: ${{ inputs.santaModel }}
          methodName: export_links
          inputs:
            path: ${{ inputs.path }}
        dependsOn: []
