id: 06ed8663-689b-4ddd-8f13-9bd060ec005f
name: secret-santa
description: >-
  Draw this year's Secret Santa (kept if already drawn), compose one SMS per
  person with an encrypted reveal link, verify every link, then text them via
  Twilio. Dry run by default; set testRecipient to text only yourself first.
  Run manually — there is no schedule.
version: 1
tags: {}
inputs:
  properties:
    dryRun:
      type: boolean
      default: true
      description: Log what would be sent without texting anyone. Set false to send for real.
    testRecipient:
      type: string
      default: ""
      description: >-
        Name of one participant (e.g. yourself) to text instead of everyone.
        Empty sends to everyone.
    redraw:
      type: boolean
      default: false
      description: >-
        Throw away this year's existing draw and draw again. Anyone already
        texted will have a stale link.
    from:
      type: string
      default: SANTA
      description: >-
        Sender shown on the text: an alphanumeric ID like SANTA (UK, no
        replies) or your Twilio number in E.164.
jobs:
  - name: prepare
    description: Draw (or keep the existing draw), compose the messages, and re-check every link.
    dependsOn: []
    steps:
      - name: draw
        task:
          type: model_method
          modelIdOrName: santa-family
          methodName: draw
          inputs:
            redraw: ${{ inputs.redraw }}
        dependsOn: []
      - name: compose
        task:
          type: model_method
          modelIdOrName: santa-family
          methodName: compose
        dependsOn:
          - step: draw
            condition:
              type: succeeded
      - name: verify
        task:
          type: model_method
          modelIdOrName: santa-family
          methodName: verify
        dependsOn:
          - step: compose
            condition:
              type: succeeded

  - name: check
    description: Refuse to send unless every link decrypts and the draw obeys every rule.
    dependsOn:
      - job: prepare
        condition:
          type: succeeded
    steps:
      - name: links-ok
        allowFailure: false
        task:
          type: assert
          expr: data.latest("santa-family", "linkcheck").attributes.ok == true
          message: >-
            Link check failed: ${{ data.latest("santa-family", "linkcheck").attributes.problems }}
          severity: high
        dependsOn: []

  - name: send
    description: Text everyone (or just testRecipient). Dry run unless dryRun is false.
    dependsOn:
      - job: check
        condition:
          type: succeeded
    steps:
      - name: send-outbox
        task:
          type: model_method
          modelIdOrName: twilio
          methodName: send_outbox
          inputs:
            sourceModel: santa-family
            outbox: outbox
            from: ${{ inputs.from }}
            dryRun: ${{ inputs.dryRun }}
            only: '${{ inputs.testRecipient == "" ? [] : [inputs.testRecipient] }}'
            # The outbox is stored in the vault; this expression is resolved at
            # run time and swamp masks the values in logs and reports.
            messages: ${{ data.latest("santa-family", "outbox").attributes.messages }}
        dependsOn: []
