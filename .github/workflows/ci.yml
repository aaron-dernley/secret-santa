name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8 # match swamp's bundled deno (swamp doctor extensions --json → denoPath)
      - name: Format
        run: deno fmt --check
      - name: Lint (code + slow types / JSDoc)
        run: deno task lint
      - name: Type-check
        run: deno task check
      - name: Test
        run: deno task test
